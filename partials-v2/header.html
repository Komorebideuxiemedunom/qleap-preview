<aside class="runner" aria-label="Your visit, recorded as a test scenario on this device" data-runner>
  <a class="r-brand" href="/">{{logo}}</a>
  <button class="r-toggle" type="button" aria-expanded="false" data-r-toggle><span>Your visit as a test scenario</span><b data-r-count-m>00</b></button>
  <div class="r-head"><b>Scenario: your visit</b><span data-r-steps></span></div>
  <p class="r-intro">This panel writes the parts of the site you read as a test scenario, so you can send it to us if you want to. It stays in this browser tab.</p>
  <ol class="r-log" data-r-log tabindex="0" aria-label="Logged steps of your visit"></ol>
  
  <div class="r-foot">
    <div class="r-count"><b data-r-count>00</b><span>steps logged<br>on this page</span></div>
    <div class="r-bar"><i data-r-bar></i></div>
    <p class="r-note"><span>Kept on this device. Nothing is sent.</span><span class="r-btns"><button class="r-clear" type="button" data-r-clear>Clear</button><button class="r-clear" type="button" data-r-stop>Stop logging</button></span></p>
    <a class="r-cta" href="/#scenario">See your scenario <span aria-hidden="true">→</span></a>
  </div>
</aside>
