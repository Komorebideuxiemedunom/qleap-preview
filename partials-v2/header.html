<aside class="runner" aria-label="Your visit, recorded as a test scenario on this device" data-runner>
  <a class="r-brand" href="/">{{logo}}</a>
  <button class="r-toggle" type="button" aria-expanded="false" data-r-toggle><span>Your test run · <span data-r-current>starting</span></span><b data-r-count-m>00</b></button>
  <div class="r-head"><b>Scenario: your visit</b><span data-r-steps>0 steps</span></div>
  <ol class="r-log" data-r-log aria-live="polite" tabindex="0" aria-label="Logged steps of your visit"></ol>
  <p class="r-empty" data-r-empty>Each part of the site you read is logged here, the way a tester logs a test run.</p>
  <div class="r-foot">
    <div class="r-count"><b data-r-count>00</b><span>steps<br>passed</span></div>
    <div class="r-bar"><i data-r-bar></i></div>
    <p class="r-note"><span>Recorded on this device only. Nothing is sent.</span><button class="r-clear" type="button" data-r-clear>Clear</button></p>
    <a class="r-cta" href="/#scenario">See your scenario <span aria-hidden="true">→</span></a>
  </div>
</aside>
