<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#0065dd">
<link rel="icon" href="/assets/img/q.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/v2/assets/css/v2.css">{{css}}
<script>document.documentElement.classList.replace('no-js','js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('motion');</script>
<script src="/v2/assets/js/v2.js" defer></script>{{js}}
</head>
<body class="{{bodyclass}}" data-feature="{{feature}}">
<a class="skip" href="#main">Skip to content</a>
{{header}}
<div class="page">
{{topbar}}
<main id="main" tabindex="-1">
{{main}}
</main>
{{footer}}
</div>
</body>
</html>
